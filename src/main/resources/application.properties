spring.application.name=university-db-app

# Use the existing database. Override these values with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Check entity mappings without creating or changing tables or loading sample data.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
